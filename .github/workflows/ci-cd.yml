name: Build, publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/devops-task-manager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: image
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/devops-task-manager-backend:latest
            ghcr.io/${{ steps.image.outputs.owner }}/devops-task-manager-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/devops-task-manager-frontend:latest
            ghcr.io/${{ steps.image.outputs.owner }}/devops-task-manager-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy containers to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_OWNER
          script: |
            set -eu
            IMAGE_OWNER="$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
            mkdir -p /opt/devops-task-manager
            cd /opt/devops-task-manager
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cat > compose.yaml <<EOF
            services:
              backend:
                image: ghcr.io/$IMAGE_OWNER/devops-task-manager-backend:latest
                container_name: task-manager-backend
                restart: unless-stopped
                expose:
                  - "5000"
              frontend:
                image: ghcr.io/$IMAGE_OWNER/devops-task-manager-frontend:latest
                container_name: task-manager-frontend
                restart: unless-stopped
                depends_on:
                  - backend
                ports:
                  - "80:80"
            EOF
            docker compose -f compose.yaml pull
            docker compose -f compose.yaml up -d --remove-orphans
            docker image prune -f
