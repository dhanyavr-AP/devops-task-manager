services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-local}/devops-task-manager-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: task-manager-backend
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    image: ghcr.io/${GHCR_OWNER:-local}/devops-task-manager-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    container_name: task-manager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
